name: Daily link import

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run import:links
      - run: npm run build
      - name: Commit imported posts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new posts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts public/assets/images
          git commit -m "Import daily links"
          git push
